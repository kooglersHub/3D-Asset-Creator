name: Pipeline checks

on: [push, pull_request]

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q tools
      - run: modal run tools/modal_assetfurnace.py --help
  blender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y blender
      - run: blender --background --python-exit-code 1 --python tests/blender_equipment_smoke.py
